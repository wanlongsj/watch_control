name: Build Android APK

on:
  push:                # 代码推送到 main 分支时触发
    branches: [ main ]
  pull_request:        # 有 PR 提交时触发
    branches: [ main ]
  workflow_dispatch:   # 支持在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 GitHub 提供的 Ubuntu 环境[reference:5]
    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 赋予 Gradle 执行权限
      run: chmod +x gradlew

    - name: 构建 Debug APK
      run: ./gradlew assembleDebug   # 如果是 release 版，可改为 assembleRelease[reference:6]

    - name: 上传 APK 作为构建产物
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: phone/build/outputs/apk/debug/*.apk  # 根据实际模块名调整路径
